[package]
name = "llamacpp-rs"
description = "Rust bindings for llama.cpp, with mtmd (multimodal) support enabled by default"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cron-icle/llamacpp-rs"
links = "llama"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

include = [
    "ffi/wrapper.h",
    "ffi/wrapper_common.h",
    "ffi/wrapper_common.cpp",
    "ffi/wrapper_utils.h",
    "ffi/wrapper_mtmd.h",
    "build.rs",
    "/src",

    "/vendor/llama.cpp/common/**/*.h",
    "/vendor/llama.cpp/common/**/*.hpp",
    "/vendor/llama.cpp/common/**/*.cpp",
    "/vendor/llama.cpp/ggml/include/*.h",
    "/vendor/llama.cpp/ggml/src/*.h",
    "/vendor/llama.cpp/ggml/src/*.c",
    "/vendor/llama.cpp/ggml/src/*.cpp",
    "/vendor/llama.cpp/src/*.h",
    "/vendor/llama.cpp/src/*.cpp",
    "/vendor/llama.cpp/src/models/*.h",
    "/vendor/llama.cpp/src/models/*.cpp",
    "/vendor/llama.cpp/tools/mtmd/*.h",
    "/vendor/llama.cpp/tools/mtmd/*.cpp",
    "/vendor/llama.cpp/tools/mtmd/models/*.h",
    "/vendor/llama.cpp/tools/mtmd/models/*.cpp",
    "/vendor/llama.cpp/tools/mtmd/debug/*.h",
    "/vendor/llama.cpp/tools/mtmd/debug/*.cpp",

    "/vendor/llama.cpp/convert_hf_to_gguf.py", # Yes, it's required
    "/vendor/llama.cpp/common/build-info.cpp.in",

    "/vendor/llama.cpp/ggml/src/ggml-cuda.cu",
    "/vendor/llama.cpp/ggml/src/ggml-metal.m",
    "/vendor/llama.cpp/ggml/src/ggml-metal.metal",

    "/vendor/llama.cpp/include/llama.h",
    "/vendor/llama.cpp/include/llama-cpp.h",

    "/vendor/llama.cpp/ggml/src/ggml-cpu/**/*",
    "/vendor/llama.cpp/ggml/src/ggml-cuda/**/*",
    "/vendor/llama.cpp/ggml/src/ggml-metal/**/*",
    "/vendor/llama.cpp/ggml/src/ggml-vulkan/**/*",
    "/vendor/llama.cpp/ggml/src/ggml-opencl/**/*",
    "/vendor/llama.cpp/ggml/src/ggml-hip/**/*",

    "/vendor/llama.cpp/ggml/src/llamafile/sgemm.h",
    "/vendor/llama.cpp/ggml/src/llamafile/sgemm.cpp",

    "/vendor/llama.cpp/pocs",
    "/vendor/llama.cpp/vendor",

    "/vendor/llama.cpp/CMakeLists.txt",
    "/vendor/llama.cpp/common/CMakeLists.txt",
    "/vendor/llama.cpp/ggml/CMakeLists.txt",
    "/vendor/llama.cpp/ggml/src/CMakeLists.txt",
    "/vendor/llama.cpp/src/CMakeLists.txt",

    "/vendor/llama.cpp/cmake",
    "/vendor/llama.cpp/ggml/cmake",
    "/vendor/llama.cpp/common/cmake",
]

[dependencies]
enumflags2 = "0.7.12"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-core = { workspace = true }
encoding_rs = { workspace = true }
llguidance = { version = "1.7.5", optional = true }
toktrie = { version = "1.7.5", optional = true }

[build-dependencies]
bindgen = { workspace = true }
cc = { workspace = true, features = ["parallel"] }
cmake = "0.1"
find_cuda_helper = "0.2.0"
glob = "0.3.3"
walkdir = "2"

[dev-dependencies]
encoding_rs = { workspace = true }
tracing-subscriber = { workspace = true }
hf-hub = { workspace = true }

[features]
default = ["openmp", "android-shared-stdcxx", "common", "mtmd"]
# Enable the JSON-schema-to-grammar API. Backed by `llama.cpp`'s `common/`
# static library; disabling drops `libcommon.a` (~14 MB) plus the
# `wrapper_common.cpp` bindings from the link line. Enabled by default for
# backwards compatibility.
common = []
cuda = []
# Disables the need to dynamically link against libcuda.so / cuda.dll
cuda-no-vmm = ["cuda"]
# Metal frameworks are always linked on Apple targets; this feature is kept
# as a no-op for backwards compatibility with consumers that enable it
# explicitly.
metal = []
dynamic-link = []
vulkan = []
# OpenCL backend (GGML_OPENCL=ON) — the Qualcomm-supported path for Adreno
# GPUs. The build needs OpenCL headers + a libOpenCL.so to link; on a
# cross-compile (e.g. Android) point CMake at them via the
# OPENCL_INCLUDE_DIR / OPENCL_LIBRARY env vars (build.rs forwards them),
# since FindOpenCL can't locate an SDK.
opencl = []
openmp = []
# Link GNU OpenMP (`libgomp`) statically on GNU targets while keeping OpenMP
# enabled. Useful for self-contained downstream binaries.
static-openmp = ["openmp"]
rocm = []
# Build the BLAS backend with Intel MKL (x86_64-only; requires MKLROOT set).
mkl = []
sampler = []
# Only has an impact on Android.
android-shared-stdcxx = ["shared-stdcxx"]
android-static-stdcxx = ["static-stdcxx"]
# Link the C++ standard library statically where the target toolchain
# supports it. Currently used by Android and Linux GNU/musl targets.
static-stdcxx = []
shared-stdcxx = []
mtmd = []
system-ggml = []
system-ggml-static = ["system-ggml"]
llguidance = ["dep:llguidance", "dep:toktrie"]
dynamic-backends = ["dynamic-link"]

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["sampler"]

[[example]]
name = "usage"
path = "../examples/usage.rs"

[[example]]
name = "llguidance"
path = "../examples/llguidance.rs"
required-features = ["llguidance"]
