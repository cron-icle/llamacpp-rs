[package]
name = "llama-cpp"
description = "llama.cpp bindings for Rust (Chronicle fork, mtmd enabled by default)"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anadi45/llama-cpp-rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
enumflags2 = "0.7.12"
llama-cpp-sys = { path = "../llama-cpp-sys", version = "0.1.0" }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-core = { workspace = true }
encoding_rs = { workspace = true }
llguidance = { version = "1.7.5", optional = true }
toktrie = { version = "1.7.5", optional = true }

[dev-dependencies]
encoding_rs = { workspace = true }
tracing-subscriber = { workspace = true }
hf-hub = { workspace = true }

[features]
default = ["openmp", "android-shared-stdcxx", "common", "mtmd"]
# Enable the JSON-schema-to-grammar API. Backed by `llama.cpp`'s `common/`
# static library; disabling drops `libcommon.a` (~14 MB) plus the
# `wrapper_common.cpp` bindings from the link line. Enabled by default for
# backwards compatibility.
common = ["llama-cpp-sys/common"]
cuda = ["llama-cpp-sys/cuda"]
cuda-no-vmm = ["cuda", "llama-cpp-sys/cuda-no-vmm"]
metal = ["llama-cpp-sys/metal"]
dynamic-link = ["llama-cpp-sys/dynamic-link"]
vulkan = ["llama-cpp-sys/vulkan"]
opencl = ["llama-cpp-sys/opencl"]
openmp = ["llama-cpp-sys/openmp"]
# Link GNU OpenMP (`libgomp`) statically on GNU targets while keeping OpenMP
# enabled. Useful for self-contained downstream binaries.
static-openmp = ["llama-cpp-sys/static-openmp"]
rocm = ["llama-cpp-sys/rocm"]
mkl = ["llama-cpp-sys/mkl"]
sampler = []
# Only has an impact on Android.
android-shared-stdcxx = ["llama-cpp-sys/shared-stdcxx"]
android-static-stdcxx = ["llama-cpp-sys/static-stdcxx"]
# Generic alias for non-Android targets that also support static C++ stdlib
# linkage through the sys crate.
static-stdcxx = ["llama-cpp-sys/static-stdcxx"]
mtmd = ["llama-cpp-sys/mtmd"]
system-ggml = ["llama-cpp-sys/system-ggml"]
system-ggml-static = ["llama-cpp-sys/system-ggml-static"]
llguidance = ["dep:llguidance", "dep:toktrie"]
dynamic-backends = ["llama-cpp-sys/dynamic-backends"]


[target.'cfg(all(target_os = "macos", any(target_arch = "aarch64", target_arch = "arm64")))'.dependencies]
llama-cpp-sys = { path = "../llama-cpp-sys", version = "0.1.0", features = [
    "metal",
] }

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["sampler"]

[[example]]
name = "usage"
path = "../examples/usage.rs"

[[example]]
name = "llguidance"
path = "../examples/llguidance.rs"
required-features = ["llguidance"]
